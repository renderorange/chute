name: slack-pr-events

# Posts PR lifecycle events (opened / merged / closed / assigned) to the develop
# channel. The workflow and the action are vendored into this repo because chute
# is public and cannot use them from the private renderorange/.github.
on:
  pull_request:
    types: [opened, closed, assigned]

jobs:
  notify:
    uses: ./.github/workflows/pr-events.yml
    secrets: inherit
